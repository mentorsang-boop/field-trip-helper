<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결과보고서 · 현장체험학습 도우미</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;700&display=swap">
  <style>
    /* 인쇄용 문서라 화면 테마와 상관없이 흰 종이로 고정 */
    @page { size: A4; margin: 14mm; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #E9ECF2; color: #111; font: 11pt/1.65 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .bar { position: sticky; top: 0; background: #1B2233; color: #fff; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 1; }
    .bar button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #2F6BFF; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .bar span { font-size: 14px; opacity: .8; }
    .page { width: 210mm; max-width: 100%; min-height: 297mm; margin: 16px auto; background: #fff; padding: 14mm; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
    h1 { font: 700 18pt/1.3 "Noto Serif KR", serif; text-align: center; margin: 0 0 4mm; }
    .meta { width: 100%; border-collapse: collapse; margin-bottom: 5mm; font-size: 10.5pt; }
    .meta th, .meta td { border: 1px solid #999; padding: 2mm 3mm; text-align: left; vertical-align: top; }
    .meta th { background: #F2F3F6; width: 22mm; white-space: nowrap; }
    h2 { font: 700 12pt "Noto Serif KR", serif; margin: 4mm 0 1.5mm; padding-bottom: 1mm; border-bottom: 1.5px solid #333; }
    p { margin: 0; white-space: pre-line; }
    .empty { color: #888; }
    .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin-top: 4mm; }
    .photos figure { margin: 0; break-inside: avoid; }
    .photos img { width: 100%; height: 52mm; object-fit: cover; border: 1px solid #ccc; display: block; }
    .photos figcaption { font-size: 9pt; color: #444; margin-top: 1mm; }
    .msg { max-width: 600px; margin: 15vh auto; text-align: center; padding: 0 16px; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .page { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; break-after: page; }
      .page:last-child { break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="bar"><button id="print">🖨 인쇄 / PDF 저장</button><span id="info">불러오는 중…</span></div>
  <main id="pages"></main>
  <script type="module" src="js/report.js"></script>
</body>
</html>
